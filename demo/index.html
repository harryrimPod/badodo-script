<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Badodo Script — Babylon.js Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0e14; }
    #scene { width: 100%; height: 100%; display: block; }

    #hud {
      position: absolute; top: 16px; left: 16px;
      font-family: "SF Mono", Consolas, monospace;
      color: #d7e0f0; background: rgba(20, 24, 34, 0.85);
      border: 1px solid rgba(120, 140, 170, 0.25);
      border-radius: 10px; padding: 14px 16px; font-size: 13px;
      line-height: 1.6; max-width: 380px; backdrop-filter: blur(6px);
    }
    #hud .title { font-size: 15px; font-weight: 700; color: #7fd4ff; margin-bottom: 6px; }
    #hud code { color: #ffd580; }
    #status { position: absolute; bottom: 16px; left: 16px; right: 16px;
      font-family: "SF Mono", Consolas, monospace; font-size: 12px;
      color: #8ea0b8; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud">
    <div class="title">Badodo Script 运行中</div>
    <div>脚本：<code>demo.bds</code></div>
    <div>点击立方体切换灯光 · 立方体持续旋转</div>
  </div>

  <div id="status">正在初始化…</div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="./badodo-runtime.js"></script>
  <script>
    (async function () {
      const status = document.getElementById("status");
      const log = (msg) => { status.textContent = msg; };

      const canvas = document.getElementById("scene");
      const engine = new BABYLON.Engine(canvas, true);
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.05, 0.06, 0.09, 1);

      const camera = new BABYLON.ArcRotateCamera(
        "camera", -Math.PI / 2, Math.PI / 3, 8,
        BABYLON.Vector3.Zero(), scene
      );
      camera.attachControl(canvas, true);

      new BABYLON.HemisphericLight("ambient", new BABYLON.Vector3(0, 1, 0), scene);

      // 立方体（可点击）
      const cubeMesh = BABYLON.MeshBuilder.CreateBox("cube", { size: 2 }, scene);
      cubeMesh.material = new BABYLON.StandardMaterial("cubeMat", scene);
      cubeMesh.material.diffuseColor = new BABYLON.Color3(0.3, 0.6, 1.0);

      // 点光源（用于"开关灯"演示）
      const pointLight = new BABYLON.PointLight("light", BABYLON.Vector3.Zero(), scene);
      pointLight.position = new BABYLON.Vector3(0, 3, 4);
      pointLight.diffuse = new BABYLON.Color3(1, 0.85, 0.4);
      pointLight.intensity = 1;

      // 地面
      const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 20, height: 20 }, scene);
      ground.material = new BABYLON.StandardMaterial("groundMat", scene);
      ground.material.diffuseColor = new BABYLON.Color3(0.18, 0.2, 0.24);

      // ---- 用 Babylon 适配器把对象包装成 Badodo 节点 ----
      const cube = Badodo.createMeshNode(cubeMesh);
      const light = Badodo.createLightNode(pointLight);

      // ---- 创建运行时并注册节点 ----
      const rt = new Badodo.BadodoRuntime();
      rt.registerNode("cube", cube);
      rt.registerNode("light", light);

      // ---- 桥接点击事件 + 每帧驱动 ----
      Badodo.bridgeMeshClick(scene, cubeMesh, cube, rt);
      scene.onBeforeRenderObservable.add(() => {
        const delta = engine.getDeltaTime() / 1000;
        rt.tick(delta);
      });

      // ---- 运行脚本（从加密的 .bds.bin 加载）----
      const KEY = "my-secret-key-2026";
      await Badodo.runEncrypted(rt, "./demo.bds.bin", KEY);
      log("脚本已加载并运行（AES-256 解密）");

      engine.runRenderLoop(() => scene.render());
      window.addEventListener("resize", () => engine.resize());
    })().catch((err) => {
      document.getElementById("status").textContent = "运行出错：" + err.message;
    });
  </script>
</body>
</html>
